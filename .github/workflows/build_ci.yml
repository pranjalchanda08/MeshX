name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      - rel/*
  pull_request:
    branches:
      - dev
      - main
      - rel/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml protobuf grpcio-tools
        sudo apt-get install -y ccache protobuf-compiler

    - name: Cache ccache
      uses: actions/cache@v3
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.ref_name }}-
          ccache-${{ runner.os }}-

    - name: Build all products
      run: |
        export APP_PATH=$(pwd)
        mkdir -p .ccache

        sudo docker run --rm \
          -v $PWD:$APP_PATH -w $APP_PATH -u $UID \
          -v $PWD/.ccache:/tmp/.ccache \
          -e CCACHE_DIR=/tmp/.ccache \
          -e HOME=/tmp \
          espressif/idf:release-v5.4 /bin/bash -c "idf.py -DPROD_NAME='all_in_one' reconfigure"

        export CCACHE_DIR=$PWD/.ccache
        for product in $(python -c "import yaml; print(' '.join([p['name'] for p in yaml.safe_load(open('tools/scripts/prod_profile.ci.yml'))['prod']['products']]))"); do
          rm -f sdkconfig
          sh tools/scripts/build_ci.sh $product
        done
      shell: bash
