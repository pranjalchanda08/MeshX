name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      # - rel/*
  pull_request:
    branches:
      - dev
      - main
      # - rel/*

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    - name: Update submodule (only doxygen-awesome-css)
      run: git submodule update --init docs/doxygen-awesome-css

    - name: Install Graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Latest Doxygen (Official Binary)
      run: |
        DOXYGEN_VER="1.14.0"
        curl -sSL "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VER//./_}/doxygen-${DOXYGEN_VER}.linux.bin.tar.gz" | sudo tar -xz --strip-components=1 -C /usr/local
        doxygen --version

    - name: Generate Doxygen Docs
      run: doxygen .vscode/.doxygen/meshx.doxyconfig.ini

    - name: Verify index.html exists
      run: test -f ./docs/doxygen/html/index.html

    - name: Upload generated docs
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: ./docs/doxygen/html

  deploy:
    permissions:
      contents: write
      pull-requests: write
      pages: write

    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download generated docs
      uses: actions/download-artifact@v4
      with:
        name: docs-html
        path: public
    - name: Verify Downloaded docs
      run: test -f ./public/index.html

    - name: Set deployment folder
      id: vars
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          echo "dir=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
        elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
          echo "dir=main" >> $GITHUB_OUTPUT
        elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
          echo "dir=dev" >> $GITHUB_OUTPUT
        fi
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
        destination_dir: ${{ steps.vars.outputs.dir }}
        keep_files: true


