<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshX Orbital Command Console</title>
    <!-- Premium Aerospace Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="crt-scanline"></div>
    <div class="bg-grid"></div>
    <div class="ambient-glow"></div>

    <div class="app-container">
        <!-- Header Bar -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-satellite logo-icon"></i>
                <span class="logo-text">MESH<span class="highlight">X</span></span>
                <span class="badge">ORBITAL LINK ACTIVE</span>
            </div>
            
            <div class="port-selector-container">
                <div class="selector-group connection-group">
                    <label for="port-select"><i class="fa-solid fa-plug"></i> DATA_PORT</label>
                    <select id="port-select">
                        <option value="">AWAITING SCAN...</option>
                    </select>
                    <button id="connect-btn" class="btn btn-primary"><i class="fa-solid fa-link"></i> INITIATE LINK</button>
                    <button id="mxcp-shift-btn" class="btn btn-mxcp" title="Shift MXCP Channel over Console"><i class="fa-solid fa-shuffle"></i> SHIFT MXCP</button>
                </div>
                
                <div class="header-divider"></div>
                
                <div class="selector-group flash-group">
                    <label for="bsp-select"><i class="fa-solid fa-microchip icon-cyan"></i> SYS_BSP</label>
                    <select id="bsp-select">
                        <option value="">SELECT...</option>
                    </select>

                    <label for="profile-select"><i class="fa-solid fa-box icon-cyan"></i> PROFILE</label>
                    <select id="profile-select" disabled>
                        <option value="">SELECT...</option>
                    </select>

                    <label class="checkbox-container">
                        <input type="checkbox" id="erase-flash-chk">
                        <span class="checkmark chk-flash"></span> <span class="chk-label">ERASE</span>
                    </label>
                    <button id="flash-btn" class="btn btn-secondary flash-btn" disabled title="Flash firmware binary"><i class="fa-solid fa-bolt"></i> BURN_FW</button>
                    <button id="flash-mxc-btn" class="btn btn-secondary btn-config-flash" disabled title="Flash custom configuration"><i class="fa-solid fa-upload"></i> BURN_CFG</button>
                </div>
            </div>
        </header>

        <!-- Dashboard Grid Layout -->
        <main class="dashboard-grid">
            
            <!-- BLE Mesh Topography -->
            <section class="card topo-card tech-panel">
                <div class="card-header">
                    <div class="title-wrap">
                        <i class="fa-solid fa-network-wired header-icon icon-cyan"></i>
                        <h2>TOPOGRAPHY MAP</h2>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="refresh-composition-btn" class="btn btn-icon" title="Refresh dynamic elements"><i class="fa-solid fa-arrows-rotate"></i></button>
                        <span class="live-pulse"></span>
                    </div>
                </div>
                <div class="card-content">
                    <div class="topo-viewport" id="topo-viewport">
                        <div class="empty-state">
                            <i class="fa-solid fa-satellite-dish"></i>
                            <p>NO SIGNAL DETECTED.<br>ESTABLISH LINK TO COMMENCE SCAN.</p>
                        </div>
                    </div>
                </div>
            </section>


            <!-- Decoded Virtual Logs Terminal -->
            <section class="card logs-card tech-panel">
                <div class="card-header">
                    <div class="title-wrap">
                        <i class="fa-solid fa-terminal header-icon icon-orange"></i>
                        <h2>DECODED TELEMETRY STREAM</h2>
                    </div>
                    <div class="log-controls">
                        <label class="checkbox-container">
                            <input type="checkbox" id="filter-err" checked>
                            <span class="checkmark chk-err"></span> <span class="chk-label">ERR</span>
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="filter-wrn" checked>
                            <span class="checkmark chk-wrn"></span> <span class="chk-label">WRN</span>
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="filter-dbg" checked>
                            <span class="checkmark chk-dbg"></span> <span class="chk-label">DBG</span>
                        </label>
                        <div class="vertical-divider"></div>
                        <button id="autoscroll-btn" class="btn btn-ghost active" title="Toggle Autoscroll"><i class="fa-solid fa-angles-down"></i></button>
                        <button id="clear-logs-btn" class="btn btn-ghost" title="Clear Logs"><i class="fa-solid fa-trash-can"></i></button>
                        <button id="export-logs-btn" class="btn btn-ghost" title="Export Logs"><i class="fa-solid fa-download"></i></button>
                    </div>
                </div>
                <div class="card-content">
                    <div class="terminal-body" id="log-terminal">
                        <!-- Logs stream here -->
                    </div>
                </div>
            </section>

            <!-- Packet Dissector Timeline -->
            <section class="card packets-card tech-panel">
                <div class="card-header">
                    <div class="title-wrap">
                        <i class="fa-solid fa-microchip header-icon icon-cyan"></i>
                        <h2>PACKET DISSECTOR</h2>
                    </div>
                    <div class="actions">
                        <button id="clear-packets-btn" class="btn btn-ghost"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
                <div class="card-content">
                    <div class="packets-timeline" id="packets-timeline">
                        <div class="empty-state">
                            <i class="fa-solid fa-receipt"></i>
                            <p>WAITING FOR MXSP STREAM...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Raw CLI Console Commands -->
            <section class="card cli-card tech-panel">
                <div class="card-header">
                    <div class="title-wrap">
                        <i class="fa-solid fa-keyboard header-icon"></i>
                        <h2>UPLINK CONSOLE</h2>
                    </div>
                </div>
                <div class="card-content" style="padding: 0;">
                    <div class="cli-terminal" id="cli-output">
                        SYSTEM INITIALIZED. AWAITING UPLINK.<br>
                    </div>
                    <div class="cli-input-wrapper">
                        <span class="cli-prompt">SYS_OP&gt;</span>
                        <input type="text" id="cli-input" placeholder="ENTER COMMAND (e.g. 'ut 8 1 1 1')...">
                        <button id="cli-send-btn" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Script Import -->
    <script src="app.js"></script>
</body>
</html>
