# ESP32-DevKitC / ESP32 Zephyr RAM Tuning
#
# ESP32 has dual-bank internal SRAM (Region 0 and Region 1) and reserves 0xDB5C (~55 KB)
# of Region 0 for the Bluetooth controller binary blob (libbtdm_app.a).
# Zephyr's system heap buffer (kheap_buf__system_heap) is placed in Region 0 (dram0_0_seg).
# When CONFIG_HEAP_MEM_POOL_SIZE is set to 64 KB (65536 bytes) globally, dram0_0_seg
# overflows because Region 0 must hold the BT reserve (55 KB) + system heap (64 KB) +
# BSS/noinit data, exceeding Region 0's capacity (~170 KB usable).
#
# On ESP32, Zephyr provides Region 1 as a secondary internal heap (ESP_HEAP_MEM_POOL_REGION_1_SIZE),
# so Region 0's system heap pool is scaled to 32 KB, leaving sufficient room in dram0_0_seg.

CONFIG_HEAP_MEM_POOL_SIZE=32768

