prod:
    cid: 0x7908
    products:
        - name: 4_relay_panel
          pid: 0x0001
          elements:
              - switch_relay_server: 4

        - name: 4_relay_sw
          pid: 0x0006
          elements:
              - switch_relay_client: 4

        - name: 4x4_Relay_Switch_Pannel
          pid: 0x0002
          elements:
              - switch_relay_client: 4
              - switch_relay_server: 4

        - name: CTL_light_strip
          pid: 0x0003
          elements:
              - light_cwww_server: 1

        - name: all_in_one
          pid: 0x0004
          elements:
              - switch_relay_client: 1
              - switch_relay_server: 1
              - light_cwww_server: 1
              - light_cwww_client: 1

        - name: sensor_node
          pid: 0x0005
          elements:
              - sensor_server: 1

        - name: rgb_lamp
          pid: 0x0007
          elements:
              - rgb_server: 1
        - name: relay_panel_with_gpio
          pid: 0x0008
          elements:
              - switch_relay_server: 2
          components:
              - gpio: 1
              - pwm: 1
              - gpio_runtime: 1
              - io_abstraction: 1
          gpio:
              pins:
                  - name: "RELAY_1"
                    logical_pin: 0
                    physical_pin: 4
                    mode: "output"
                    pull: "none"
                    initial_level: 0
                    signal_inversion: false

                  - name: "BUTTON_1"
                    logical_pin: 1
                    physical_pin: 5
                    mode: "input"
                    pull: "pull_up"
                    interrupt:
                        trigger: "negative_edge"
                        task_priority: 5
                        task_stack_size: 2048

                  - name: "LED_PWM"
                    logical_pin: 2
                    physical_pin: 6
                    mode: "pwm_output"
                    pwm:
                        frequency: 1000
                        resolution: 10
                        duty_cycle: 50
                        channel: 0
