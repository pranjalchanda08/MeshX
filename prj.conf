# MeshX Subsystem
CONFIG_MESHX=y

# C++ Support (No Exceptions, No RTTI, with STL)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y

# Optimization for Code Size & RAM
CONFIG_SIZE_OPTIMIZATIONS=y

# System Stacks & Heap
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Storage and Settings
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_HWINFO=y
CONFIG_SETTINGS=y
CONFIG_FLASH_MAP=y
CONFIG_BT_SETTINGS=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_EXT_ADV=n
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_STACK_SENTINEL=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# Bluetooth Mesh
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_CFG_CLI=y
CONFIG_BT_MESH_GATT_PROXY=y
CONFIG_BT_MESH_ADV_LEGACY=y
CONFIG_BT_MESH_MODEL_EXTENSIONS=y
CONFIG_BT_MESH_ADV_STACK_SIZE=2048
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=y
CONFIG_BT_MESH_PB_GATT_USE_DEVICE_NAME=y
CONFIG_BT_MESH_SETTINGS_WORKQ_STACK_SIZE=2048

# Segmentation & Buffers (Required for Multi-Element Node Composition Data)
CONFIG_BT_MESH_TX_SEG_MAX=16
CONFIG_BT_MESH_RX_SEG_MAX=16
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=4
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=4
CONFIG_BT_MESH_ADV_BUF_COUNT=24

CONFIG_BT_MESH_SUBNET_COUNT=2
CONFIG_BT_MESH_APP_KEY_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=2
CONFIG_BT_MESH_LABEL_COUNT=3

# Console & Logging (Zephyr subsystem logging disabled for production/release, uncomment for debugging)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
